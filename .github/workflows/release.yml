name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Draft first: the release only becomes publicly visible in the final
      # step, once the installers are attached — never as a source-only page.
      - name: Create draft release with description
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping creation"
            exit 0
          fi
          {
            echo "## Installation"
            echo
            echo "Download the **\`.exe\`** (NSIS) or **\`.msi\`** installer below and run it. Installed copies update automatically when a new release is published here."
            echo
            awk -v tag="$TAG" '
              $0 ~ "^## " tag "$" { found=1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md
          } > release-notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Notes $TAG" --notes-file release-notes.md --draft

      - name: Build installers and attach to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Notes ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false

      - name: Publish release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
