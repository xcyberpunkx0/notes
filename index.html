<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes</title>
    <script>
      // Paint the saved theme before any bundle loads — no flash either way
      (function () {
        var bg = "#131019";
        try {
          var stored = JSON.parse(localStorage.getItem("dsa-vault-ui"));
          if (stored && stored.state && stored.state.theme === "light") {
            document.documentElement.dataset.theme = "light";
            bg = "#faf9fc";
          }
        } catch (e) {
          /* first run: dark default */
        }
        document.documentElement.style.background = bg;
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
